name: Android CI for PRs

on:
  pull_request:
    branches: [ 'main', 'release-**' ]

env:
  GRADLE_OPTS: "-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"

jobs:
  internal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Internal checks
        run: |
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            assembleInternal \
            test \
            testInternalUnitTest \
            lintInternalDebug \
            lintInternalRelease

      - name: Upload internal reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports-internal
          path: |
            **/build/reports/problems/**
            **/build/reports/tests/**
          if-no-files-found: warn

  prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prod checks
        run: |
          ./gradlew --no-daemon --max-workers=1 -Dorg.gradle.parallel=false \
            assembleProd \
            testProdDebugUnitTest \
            lintProdDebug \
            lintProdRelease

      - name: Upload prod reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports-prod
          path: |
            **/build/reports/problems/**
            **/build/reports/tests/**
          if-no-files-found: warn

  dependency-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Dependency health check
        run: |
          ./gradlew --no-daemon buildHealth

      - name: Upload dependency analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-analysis-reports
          path: |
            build/reports/dependency-analysis/build-health-report.txt
          if-no-files-found: warn
